<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нет соединения — Kupiks</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fffaf5;
        color: #1f2937;
        font-family: Manrope, system-ui, -apple-system, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
        background: #fff;
        border: 1px solid #f1e6dc;
        border-radius: 20px;
        padding: 32px 24px;
        box-shadow: 0 12px 36px -18px rgba(31, 41, 55, 0.35);
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #6b7280; font-size: 15px; line-height: 1.5; }
      button {
        border: 0;
        border-radius: 999px;
        background: #ff6b35;
        color: #fff;
        font-weight: 700;
        font-size: 15px;
        padding: 12px 24px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div style="font-size: 40px">📴</div>
      <h1>Нет подключения к интернету</h1>
      <p>Похоже, соединение пропало. Проверьте сеть — просмотренные страницы доступны из кэша.</p>
      <button onclick="location.reload()">Обновить</button>
    </div>
  </body>
</html>
